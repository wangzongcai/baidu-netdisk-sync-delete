<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>双端同步删除 · 界面原型</title>
<style>
  body{margin:0;padding:30px;background:#e8eaed;font-family:"Microsoft YaHei",sans-serif}
  h1{font-size:15px;color:#5f6368;margin:0 0 6px;font-weight:400}
  h2{font-size:12px;color:#80868b;margin:0 0 26px;font-weight:400}
  .grid{display:flex;flex-wrap:wrap;gap:30px}

  .wrap{width:196px}
  .cap{font-size:12px;color:#5f6368;margin-bottom:8px;white-space:nowrap}

  /* 迷你窗口：147 再放大 1/3 → 196 宽，各尺寸同步放大 */
  .win{
    width:196px;background:#fff;border:1px solid #c8ccd0;border-radius:10px;
    box-shadow:0 4px 17px rgba(0,0,0,.16);overflow:hidden;
  }
  .bar{
    height:36px;background:#f1f3f4;border-bottom:1px solid #dadce0;
    display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 11px;
    font-size:14px;color:#3c4043;white-space:nowrap;
  }
  /* 标题栏右侧的系统动作：最小化 / 关闭 */
  .btns{display:flex;gap:2px;flex:0 0 auto}
  .mini,.close{
    width:26px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    color:#5f6368;cursor:pointer;border-radius:5px;line-height:1;
    user-select:none;
  }
  /* 最小化横线：原来是「—」字符，太长，换成一截短横线，长度减半 */
  .mini i{display:block;width:7px;height:2px;background:#5f6368;border-radius:1px}
  .mini:hover{background:#e3e6e8}
  .mini:hover i{background:#202124}
  .close{font-size:17px}
  .close:hover{background:#d93025;color:#fff}
  .body{padding:11px}

  .main{
    width:100%;background:#d93025;color:#fff;border:none;border-radius:7px;
    padding:16px 0;font-size:21px;font-weight:700;font-family:inherit;cursor:pointer;
    white-space:nowrap;
  }
  .main:hover{background:#c5221f}
  .main.busy{background:#9aa0a6;cursor:default}
  .main.done{background:#137333;cursor:default}
  .main.fail{background:#c5221f;cursor:pointer}

  /* 启动 Edge：按小康给的图，浅灰底 + 边框的普通按钮，放在上方 */
  .sec{
    width:100%;background:#f8f9fa;color:#202124;
    border:1px solid #c8ccd0;border-radius:7px;
    padding:11px 0;font-size:19px;font-family:inherit;cursor:pointer;
    margin-bottom:11px;white-space:nowrap;
  }
  .sec:hover{background:#eef0f2}
</style>
</head>
<body>
<h1>双端同步删除 · 界面原型</h1>
<h2>窗口宽 196px | 启动时固定在屏幕右下、默认置顶 | 标题栏带最小化「–」与关闭「×」 | 完成后只显示「双删已完成」</h2>

<div class="grid">

  <div class="wrap">
    <div class="cap">① 空闲</div>
    <div class="win">
      <div class="bar"><span>柚子双删V:11149778</span><span class="btns"><span class="mini"><i></i></span><span class="close">×</span></span></div>
      <div class="body">
        <button class="sec">启动 Edge</button>
        <button class="main">同步删除</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="cap">② 执行中</div>
    <div class="win">
      <div class="bar"><span>柚子双删V:11149778</span><span class="btns"><span class="mini"><i></i></span><span class="close">×</span></span></div>
      <div class="body">
        <button class="sec">启动 Edge</button>
        <button class="main busy" disabled>删除中…</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="cap">③ 完成（只剩这一句）</div>
    <div class="win">
      <div class="bar"><span>柚子双删V:11149778</span><span class="btns"><span class="mini"><i></i></span><span class="close">×</span></span></div>
      <div class="body">
        <button class="sec">启动 Edge</button>
        <button class="main done" disabled>双删已完成</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="cap">④ 万一没删成（备选）</div>
    <div class="win">
      <div class="bar"><span>柚子双删V:11149778</span><span class="btns"><span class="mini"><i></i></span><span class="close">×</span></span></div>
      <div class="body">
        <button class="sec">启动 Edge</button>
        <button class="main fail">未完成，重试</button>
      </div>
    </div>
  </div>

</div>
</body>
</html>
